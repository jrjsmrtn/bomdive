# OpenSSF Scorecard. A monitor, not a target: several checks score low for facts about this
# project rather than defects — one maintainer means Code-Review cannot pass, and Packaging has
# nothing to report while nothing is published to a registry.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    # Scorecard's checks fail with "Resource not accessible by integration" on a private
    # repository, and publish_results would have nothing to publish. Self-activates at the flip.
    if: ${{ !github.event.repository.private }}
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          sarif_file: results.sarif
