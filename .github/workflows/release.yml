# Release: cross-compiled archives, an SBOM per artifact, SLSA L2 provenance, and a signature
# that is VERIFIED in the same run.
#
# Fires on a v* tag. Everything is built here rather than by a reusable builder, which is the
# trade ADR-0012 records: Level 2 provenance and a build we control, over Level 3 and a generator
# in the trust base.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: build, sign, publish
    runs-on: ubuntu-latest
    # Keyless signing and provenance write the repository name and the workflow path to the
    # PUBLIC Rekor transparency log. On a private repository that would publish exactly what the
    # repository is keeping private, so this cannot run until the flip.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: write      # create the release and upload to it
      id-token: write      # keyless signing, and the provenance attestation
      attestations: write  # attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true

      # syft itself, so an SBOM can be made per BINARY rather than one merged over dist/.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: build every platform, with an SBOM each
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="bomdive_${version}_${os}_${arch}"
            out="dist/${name}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "$out/bomdive" ./cmd/bomdive
            cp LICENSE README.md CHANGELOG.md "$out/"
            # One SBOM per released artifact, catalogued from the BINARY: syft reads the Go build
            # info, which is what carries the dependency versions and the standard library.
            # Scanning the source tree instead yields pkg:github components and no Go packages.
            syft scan "file:${out}/bomdive" -o "cyclonedx-json=dist/${name}.cdx.json" -q
            tar -czf "${out}.tar.gz" -C dist "$name"
          done
          ls -l dist/*.tar.gz dist/*.cdx.json

      - name: every SBOM catalogued its artifact
        run: |
          set -euo pipefail
          # Measured against syft 1.36.0 on 2026-09-17: a bomdive binary yields 15 components,
          # zero pkg:github, and pkg:golang/stdlib — which is what stdlib advisories match on.
          for sbom in dist/*.cdx.json; do
            if jq -e '[.components[].purl // empty] | any(startswith("pkg:github"))' "$sbom" >/dev/null; then
              echo "✗ $sbom catalogued the repository, not the artifact"; exit 1
            fi
            if ! jq -e '[.components[].purl // empty] | any(contains("golang/stdlib"))' "$sbom" >/dev/null; then
              echo "✗ $sbom has no Go standard library: it did not read the binary"; exit 1
            fi
            echo "✓ $sbom: $(jq '.components | length' "$sbom") components, stdlib present"
          done

      - name: checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum *.tar.gz *.cdx.json > checksums.txt && cat checksums.txt

      - name: provenance (SLSA L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the checksums, then VERIFY the signature
        run: |
          set -euo pipefail
          # cosign v3 emits a Sigstore bundle; --output-signature/--output-certificate were
          # removed. One signature over checksums.txt covers every artifact it lists.
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          # Signing produces evidence; only verifying proves the evidence is usable. A signature
          # no consumer could verify must fail the release rather than ship.
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            dist/checksums.txt
          echo "✓ signature verifies"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An rc, alpha or beta tag is a PRERELEASE: it must not become the "Latest" release that
          # go install and every download link point at. The first exercise of this pipeline is
          # expected to be an rc for exactly that reason.
          pre=""
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-alpha*|*-beta*) pre="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" ${pre:+$pre} \
            --title "${GITHUB_REF_NAME}" \
            --notes "Artifacts are signed with cosign (keyless) and carry SLSA L2 provenance, and each archive ships its own CycloneDX SBOM. **Verify before running** — the commands are in the README under Installation." \
            dist/*.tar.gz dist/*.cdx.json dist/checksums.txt dist/checksums.txt.sigstore.json
          # Verify the provenance of what was actually published, from the release itself.
          gh attestation verify dist/bomdive_"${GITHUB_REF_NAME}"_linux_amd64.tar.gz \
            --repo "${GITHUB_REPOSITORY}"
          echo "✓ provenance verifies"
