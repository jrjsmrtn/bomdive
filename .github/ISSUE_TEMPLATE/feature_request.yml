name: Feature request
description: Propose something bomdive should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Check the scope first.** bomdive reads and navigates CycloneDX documents. It is
        deliberately *not* a BOM generator, a query tool (`CycloneDX/sbom-utility` owns that), a
        vulnerability scanner, a signer or a converter. Requests in those directions are declined
        with a pointer to the tool that does it — see the README and `CONTRIBUTING.md`.
  - type: textarea
    id: question
    attributes:
      label: What question about a BOM does this answer?
      description: The problem, not the implementation. What are you trying to find out?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you answer it today?
      description: jq, another tool, by hand — and what makes that unsatisfactory.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about reading or navigating a document, not generating, scanning or editing one
          required: true
