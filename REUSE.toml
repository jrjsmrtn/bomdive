version = 1
SPDX-PackageName = "bomdive"
SPDX-PackageSupplier = "Georges Martin <jrjsmrtn@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/jrjsmrtn/bomdive"

# Files that carry no comment syntax, or where a header would be noise: prose, the fixture
# corpus (generated by testdata/generate.py, which does carry a header), Gherkin features and
# the repository's own configuration.
[[annotations]]
path = ["docs/**", "**.md", "features/**.feature", ".github/**", "testdata/**.json", "testdata/**.xml", "testdata/.schema-cache/**"]
SPDX-FileCopyrightText = "2026 Georges Martin <jrjsmrtn@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".gitignore", ".editorconfig", ".lefthook.yml", ".tmuxp.yml", "go.mod", "go.sum", "LICENSE", "REUSE.toml"]
SPDX-FileCopyrightText = "2026 Georges Martin <jrjsmrtn@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
