session_name: bomdive

windows:
  - window_name: shell
    layout: even-horizontal
    options:
      automatic-rename: false
    panes:
      - blank

  - window_name: code
    layout: even-horizontal
    options:
      automatic-rename: false
    panes:
      - $EDITOR .

  - window_name: chat
    layout: main-horizontal
    focus: true
    options:
      automatic-rename: false
      main-pane-height: "66%"
    panes:
      - jam chat
      - blank

